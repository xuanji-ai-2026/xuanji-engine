apiVersion: v1
kind: ConfigMap
metadata:
  name: xuanji-engine-config
  namespace: default
  labels:
    app: xuanji-engine
    version: v2.0
data:
  # 应用配置
  app.name: "玄玑AI数字员工引擎"
  app.version: "2.0"
  app.environment: "production"

  # API配置
  api.host: "0.0.0.0"
  api.port: "8080"
  api.workers: "4"

  # DeepSeek配置
  deepseek.api_url: "https://api.deepseek.com/v1"
  deepseek.model: "deepseek-chat"
  deepseek.timeout: "30"

  # 飞书配置
  feishu.app_id: ""
  feishu.app_secret: ""

  # 日志配置
  log.level: "INFO"
  log.format: "json"
  log.output: "stdout"

  # 数据库配置
  db.host: ""
  db.port: "5432"
  db.name: "xuanji_engine"
  db.user: "xuanji"
  db.pool_size: "10"

  # Redis配置
  redis.host: ""
  redis.port: "6379"
  redis.db: "0"
  redis.pool_size: "10"

  # 监控配置
  metrics.enabled: "true"
  metrics.port: "9090"

  # 性能配置
  performance.max_concurrent_requests: "1000"
  performance.request_timeout: "60"
  performance.connection_timeout: "10"
