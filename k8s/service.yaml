apiVersion: v1
kind: Service
metadata:
  name: xuanji-engine-service
  namespace: default
  labels:
    app: xuanji-engine
    version: v2.0
spec:
  type: ClusterIP
  selector:
    app: xuanji-engine
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8080
  sessionAffinity: None
