# 玄玑引擎前端四端子域名配置
# 部署位置: /usr/local/openresty/nginx/conf/xuanji-subdomains.conf
# 包含到主配置: include xuanji-subdomains.conf;

# HTTP重定向到HTTPS
server {
    listen 80;
    server_name app.xuanji-ai.com config.xuanji-ai.com dev.xuanji-ai.com admin.xuanji-ai.com xuanji-ai.com www.xuanji-ai.com;
    
    return 301 https://$server_name$request_uri;
}

# 官网 - xuanji-ai.com
server {
    listen 443 ssl http2;
    server_name xuanji-ai.com www.xuanji-ai.com;
    
    # SSL配置
    ssl_certificate /etc/ssl/xuanji-ai.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/xuanji-ai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    root /var/www/xuanji-ai/portal;
    index index.html;
    
    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # 前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # API代理
    location /api/ {
        proxy_pass http://127.0.0.1:8888/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # WebSocket支持
    location /ws/ {
        proxy_pass http://127.0.0.1:8888/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # 访问日志
    access_log /var/log/nginx/xuanji-portal.access.log;
    error_log /var/log/nginx/xuanji-portal.error.log;
}

