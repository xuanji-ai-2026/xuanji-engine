# 玄玑引擎完整配置 - 包含四端子域名
# 替换 /usr/local/openresty/nginx/conf/xuanji.conf

server {
    listen 80;
    server_name xuanji-ai.com www.xuanji-ai.com 43.160.237.122;

    # 前端主页 - 官网
    location / {
        root /opt/xuanji-frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 静态资源
    location /assets/ {
        root /opt/xuanji-frontend;
        expires 30d;
    }

    # API代理
    location /api/ {
        proxy_pass http://127.0.0.1:8889/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 60s;
    }
}

